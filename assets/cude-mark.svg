<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cude Code white mark">
  <title>Cude Code — white mark</title>
  <desc>Transparent white Cude Code mark. The two lower ends are deliberately flat and split, never rounded tail caps.</desc>
  <!-- Geometry traced from the supplied transparent reference artwork. -->
  <g fill="none" stroke="#fff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" transform="matrix(.5304 0 0 .57 120.2176 101.75)">
    <path d="M429 156 256 56 83 156v200l147 85"/>
    <path d="M282 441l147-85"/>
    <!-- Flat terminations preserve the reference's sharp split, rather than creating tails. -->
    <path d="M230 441v29M282 470v-29" stroke-linecap="butt"/>
  </g>
  <path d="m239 220 54 36-54 36" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
