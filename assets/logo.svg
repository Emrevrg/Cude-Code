<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cude Code logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="32"/>

  <!-- Outer hexagon -->
  <path d="M256 56 L430 156 L430 356 L256 456 L82 356 L82 156 Z"
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linejoin="round"/>

  <!-- C shape (left arc) -->
