        fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>

  <!-- > chevron (inner right) -->
  <path d="M230 210 L290 256 L230 302"
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom notch detail -->
