<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-label="Cude Code — YAZ. ANLA. ÜRET.">
  <title>Cude Code — YAZ. ANLA. ÜRET.</title>

  <defs>
    <!-- The one canonical brand mark, reused everywhere in this banner -->
    <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 429 156 L 256 56 L 83 156 L 83 356 L 230 441 L 230 470" stroke-width="42"/>
      <path d="M 282 470 L 282 441 L 429 356" stroke-width="42"/>
      <path d="M 205 190 L 300 256 L 205 322" stroke-width="38"/>
    </g>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="55%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b8bff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>

    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="tightGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="620" fill="url(#bg)"/>
  <ellipse cx="1185" cy="290" rx="430" ry="330" fill="url(#halo)"/>
  <path d="M 1010 30 A 640 640 0 0 1 1580 470" fill="none" stroke="url(#arc)" stroke-width="2.5"/>

  <!-- ============ LEFT: identity ============ -->

  <!-- Small mark -->
  <g transform="translate(88, 148) scale(0.30)">
    <use href="#mark" stroke="#ffffff"/>
  </g>

  <text x="272" y="252" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="94" font-weight="800" fill="#ffffff" letter-spacing="4"
        filter="url(#tightGlow)">CUDE CODE</text>

  <text x="276" y="312" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="33" font-weight="500" letter-spacing="9">
    <tspan fill="#d4d4dd">YAZ. ANLA. </tspan><tspan fill="url(#accent)">ÜRET.</tspan>
  </text>

  <text x="276" y="378" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="21" fill="#9a9aa8">AI destekli yeni nesil CLI kodlama asistanı.</text>
  <text x="276" y="412" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="21" fill="#9a9aa8">Terminalinden çıkmadan üretkenliğini katla.</text>

  <!-- ============ Feature columns ============ -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <line x1="272" y1="444" x2="272" y2="524" stroke="#22222e" stroke-width="1.5"/>
    <line x1="472" y1="444" x2="472" y2="524" stroke="#22222e" stroke-width="1.5"/>
    <line x1="672" y1="444" x2="672" y2="524" stroke="#22222e" stroke-width="1.5"/>
    <line x1="872" y1="444" x2="872" y2="524" stroke="#22222e" stroke-width="1.5"/>

    <g transform="translate(92, 444)">
      <text y="16" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="700" fill="#ffffff">&gt;_</text>
      <text y="46" font-size="16" font-weight="700" fill="#ffffff">Terminal Odaklı</text>
      <text y="70" font-size="13" fill="#7a7a88">Komut satırından</text>
      <text y="88" font-size="13" fill="#7a7a88">tam kontrol.</text>
    </g>

    <g transform="translate(300, 444)">
      <path d="M 10 2 L 2 15 L 8 15 L 6 26 L 15 12 L 9 12 Z" fill="#818cf8"/>
      <text y="46" font-size="16" font-weight="700" fill="#ffffff">AI Destekli</text>
      <text y="70" font-size="13" fill="#7a7a88">Kod yaz, açıkla,</text>
      <text y="88" font-size="13" fill="#7a7a88">hataları bul ve düzelt.</text>
    </g>

    <g transform="translate(500, 444)">
      <path d="M 12 2 L 22 8 L 22 20 L 12 26 L 2 20 L 2 8 Z" fill="none" stroke="#818cf8" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M 2 8 L 12 14 L 22 8 M 12 14 L 12 26" fill="none" stroke="#818cf8" stroke-width="2.4" stroke-linejoin="round"/>
      <text y="46" font-size="16" font-weight="700" fill="#ffffff">Akıllı Üretkenlik</text>
      <text y="70" font-size="13" fill="#7a7a88">Daha hızlı kodla,</text>
      <text y="88" font-size="13" fill="#7a7a88">daha fazlasını üret.</text>
    </g>

    <g transform="translate(700, 444)">
      <rect x="3" y="11" width="18" height="14" rx="3" fill="none" stroke="#818cf8" stroke-width="2.4"/>
      <path d="M 7 11 V 7 a 5 5 0 0 1 10 0 v 4" fill="none" stroke="#818cf8" stroke-width="2.4" stroke-linecap="round"/>
      <text y="46" font-size="16" font-weight="700" fill="#ffffff">Güvenli &amp; Gizli</text>
      <text y="70" font-size="13" fill="#7a7a88">Kodların sadece</text>
      <text y="88" font-size="13" fill="#7a7a88">sende kalır.</text>
    </g>
  </g>

  <!-- ============ Terminal input bar ============ -->
  <g transform="translate(88, 550)">
    <rect x="0" y="0" width="800" height="46" rx="10" fill="#0e0e16" stroke="#23232f" stroke-width="1.5"/>
    <text x="22" y="30" font-family="'JetBrains Mono', monospace" font-size="17" fill="#6366f1" font-weight="700">&gt;_</text>
    <text x="56" y="30" font-family="'JetBrains Mono', monospace" font-size="17">
      <tspan fill="#e6e6f0">cude</tspan><tspan fill="#9a9aa8"> code</tspan><tspan fill="#5a5a6a"> --help</tspan>
    </text>
  </g>

  <!-- ============ RIGHT: hero mark ============ -->
  <g transform="translate(925, 62) scale(0.86)" filter="url(#softGlow)">
    <use href="#mark" stroke="#ffffff"/>
  </g>

  <!-- ============ RIGHT: closing line ============ -->
  <text x="1548" y="512" text-anchor="end"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="30" fill="#e6e6f0">Kodlama artık</text>
  <text x="1548" y="552" text-anchor="end"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="30">
    <tspan fill="url(#accent)" font-weight="700">komutun</tspan><tspan fill="#e6e6f0"> kadar yakın.</tspan>
  </text>

  <g transform="translate(1548, 588)" text-anchor="end">
    <text font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13"
          font-weight="700" fill="#8b8b9a" letter-spacing="2">CUDE CODE  ·  AI-POWERED CLI ASSISTANT</text>
  </g>
</svg>
