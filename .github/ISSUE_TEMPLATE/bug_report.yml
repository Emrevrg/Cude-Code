name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste an API key here. Redact it before submitting."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full error output, with any keys redacted.
      render: shell
  - type: input
    id: version
    attributes:
      label: Cude Code version
      description: Output of `cude --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: e.g. anthropic / claude-opus-5, or "not applicable"
