<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Cude Code capability leaderboard — v0.1.0</title>
  <desc id="desc">Capability comparison of Cude Code, Claude Code, and Codex across terminal workflows, extensibility, providers, automation, and visual review.</desc>
