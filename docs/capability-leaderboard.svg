        <text x="698" y="142" fill="#818cf8">✓</text><text x="918" y="142" fill="#fbbf24">✓</text><text x="1130" y="142" fill="#4ade80">✓</text>
        <text x="698" y="196" fill="#818cf8">✓</text><text x="918" y="196" fill="#fbbf24">✓</text><text x="1130" y="196" fill="#4ade80">✓</text>
