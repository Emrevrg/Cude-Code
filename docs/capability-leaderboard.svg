      <text x="24" y="70" font-size="17" fill="#c7d2fe">Open · local-first · provider agnostic</text>
      <text x="24" y="96" font-size="15" fill="#818cf8">19 providers · MCP · hooks · subagents</text>
    </g>
    <g transform="translate(508 190)">
